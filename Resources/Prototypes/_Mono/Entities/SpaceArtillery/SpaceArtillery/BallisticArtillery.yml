# Base

- type: entity
  id: BallisticArtillery
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 600
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
    rotateWhilePulling: false
    rotateWhileAnchored: true
    increment: 45
  - type: DeviceLinkSink
    ports:
    - SpaceArtilleryFire
  - type: SpaceArtillery
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: BatterySelfRecharger
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: FireControllable
  - type: RadarBlip
    radarColor: "#9999FF"
    scale: 1
  # Mono
  - type: ShipRepairable
    repairTime: 15
    repairCost: 50

# 57mm

- type: entity
  id: WeaponTurretL85Autocannon
  name: L85 20mm autocannon
  parent: BallisticArtillery
  description:  A light 20mm ballistic autocannon designed for rapid fire point defense and suppressing smaller targets at close range. Cheap, light, and can be remotely activated or linked up to a GCS.
  components:
  - type: StaticPrice
    price: 250
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/50cal.rsi
    layers:
    - state: space_artillery
  - type: Battery
    maxCharge: 20000
    startingCharge: 20000
  - type: ExaminableBattery
  - type: Appearance
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 700
  - type: DeviceLinkSink
    ports:
    - Toggle
  - type: Gun
    fireRate: 12
    projectileSpeed: 192
    minAngle: 0
    maxAngle: 5
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/uaf_57mm.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
    powerChargeRate: 150
    powerUsePassive: 100
  - type: BatterySelfRecharger
  - type: Actions
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: CombatMode
    isInCombatMode: true
  - type: Airtight
  - type: ProjectileBatteryAmmoProvider
    proto: 20mmBullet
    fireCost: 15
  - type: RadiationBlocker
    resistance: 8
  - type: RadarBlip
    radarColor: "#00A6FF"
    scale: 1

# 90mm

- type: entity
  id: WeaponTurretAK570
  name: AK570 57mm autocannon
  parent: BallisticArtillery
  description: A dual-barrel, heavy 57mm autocannon firing general-purpose APHE rounds, effective for sustained fire against medium targets. Can be remotely activated or linked up to a GCS.
  components:
  - type: StaticPrice
    price: 650
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/artillery.rsi
    layers:
    - state: artillery
  - type: Appearance
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 3
    projectileSpeed: 204
    minAngle: 0
    maxAngle: 3
    burstCooldown: 0.4
    burstFireRate: 10
    shotsPerBurst: 2
    selectedMode: Burst
    availableModes: Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_duster.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
    powerChargeRate: 125
    powerUsePassive: 600
  - type: Actions
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: ExtensionCableReceiver
  - type: ProjectileBatteryAmmoProvider
    proto: 90mmBulletArmorPiercing
    fireCost: 50
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 1.5
    visibleFromOtherGrids: true

