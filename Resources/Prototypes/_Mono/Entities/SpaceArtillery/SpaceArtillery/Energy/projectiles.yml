# MARAUDER

- type: entity
  id: ShipMediumPlasmaProjectile
  name: plasma projectile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 25
        Structural: 1500
        Heat: 50
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/plasmashot.rsi
    layers:
    - state: plasmashot
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#C92BCC"
    scale: 2.5
    requireNoGrid: true
    shape: triangle
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radarColor: "#FF0040"
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 60
    intensitySlope: 8
    maxIntensity: 12
    maxTileBreak: 3

# RUBICON

- type: entity
  id: ShipRubiconProjectile
  name: EMP projectile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Radiation: 5
        Heat: 20
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#035EFC"
    scale: 2
    requireNoGrid: true
    shape: circle
  - type: TimedDespawn
    lifetime: 6.6
  - type: PointLight
    color: "#FB00FF"
  - type: EmpOnTrigger
    range: 4
    energyConsumption: 2700000
    disableDuration: 10

# DYMERE

- type: entity
  id: ShipDymereProjectile
  name: Ionized Gas Projectile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 500
        Heat: 100
      armorPenetration: 1
    penetrationThreshold: 1000
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/turbolaser_shot.rsi
    layers:
    - state: turbolaser-shot
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#C92BCC"
    scale: 3.5
    requireNoGrid: true
    shape: triangle
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    color: "#6BC1FF"
  - type: GatheringProjectile
