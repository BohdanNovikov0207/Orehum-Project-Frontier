# VESPERA

- type: entity
  id: ShipMissileASM417
  name: ASM-417 Mini Missile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 20
        Blunt: 20
        Heat: 30
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/mini_rocket.rsi
    layers:
    - state: mini-rocket
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectSmall
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 1
    requireNoGrid: true
    shape: hexagon
  - type: TimedDespawn
    lifetime: 2.5
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 6
    intensitySlope: 3
    maxIntensity: 3
  - type: GatheringProjectile
  - type: TargetSeeking
    acceleration: 50
    detectionRange: 500
    scanArc: 35
    launchSpeed: 150
    maxSpeed: 300
    trackDelay: 0.1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100 # Lua
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

