# plastitanum

- type: entity
  parent: WallPlastitanium
  id: WallPlastitaniumOutpost
  suffix: ТОЛЬКО АВАНПОСТ
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
