# Trauma Team Medic Helmet
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitTraumaTeamMedic
  categories: [ HideSpawnMenu ]
  name: шлем скафандра медика TTI
  description: Медицинский шлем с AR-интерфейсом для диагностики. Автоматически сканирует ранения и предлагает оптимальные протоколы лечения.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/helmet.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/helmet.rsi
  - type: PointLight
    color: white
  - type: FireProtection
    reduction: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

