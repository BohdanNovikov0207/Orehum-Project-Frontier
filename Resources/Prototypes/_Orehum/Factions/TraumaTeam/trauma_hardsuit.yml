# Hardsuit Trauma Team Medic
- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitTraumaTeamMedic
  name: скафандр медика TTI
  description: Модифицированный для боевых ситуаций скафандр с усиленной защитой спины. Позволяет эвакуировать раненых под огнем, сохраняя полную подвижность.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/hardsuit.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/hardsuit.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitTraumaTeamMedic
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.65
        Radiation: 0.7
        Caustic: 0.4
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1

