- type: entity
  parent: EncryptionKey
  id: EncryptionKeyTraumaTeam
  name: ключ шифрования TTI
  description: Ключ шифрования TTI.
  components:
  - type: EncryptionKey
    channels:
    - TraumaTeam
    defaultChannel: TraumaTeam
  - type: Sprite
    layers:
    - state: crypt_silver
    - sprite: _Orehum/Factions/TraumaTeam/encryption_keys.rsi
      state: trauma

- type: radioChannel
  id: TraumaTeam
  name: Trauma Team Interstellar
  keycode: 't'
  frequency: 2708
  color: "#29FFFF"
  longRange: true

# Implant

- type: entity
  id: DeathRattleImplanterTraumaTeam
  name: имплантер трекер TTI
  suffix: Трекер TTI
  parent: BaseImplantOnlyImplanter
  components:
    - type: Implanter
      implant: TrackingImplantTraumaTeam

- type: entity
  parent: NFBaseDeathRattleImplant
  id: TrackingImplantTraumaTeam
  name: трекер имплант TTI
  description: Имплант, который следит за состоянием здоровья носителя и в случае падения в критическое состояние, сообщает об этом в радио-канал TTI
  categories: [ HideSpawnMenu ]
  components:
    - type: RattleOnTrigger
      radioChannel: TraumaTeam

- type: entity
  parent: [ClothingShoesBootsMagBase, BaseJetpack]
  id: ClothingShoesMagBootsTraumaTeam
  name: магнитные ботинки TTI GravLock
  description: Трекинговые ботинки с интегрированной магнитной подошвой для работы в условиях нулевой гравитации или на скользких поверхностях. Изначально наполнены сжиженным кислородом.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/magboots.rsi
    layers:
    - state: icon
    - state: icon-on
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/magboots.rsi
    clothingVisuals:
      feet:
      - state: equipped-FEET
      - state: on-equipped-FEET
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: GasTank
    outputPressure: 5
    air:
      volume: 70
      temperature: 72
      moles:
        - 118.48044

- type: entity
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetAltTraumaTeam
  name: полноразмерная гарнитура TTI
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTraumaTeam
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/headset.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/headset.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingJumpsuitTraumaTeam
  name: комбинезон TTI TraumaFlex
  description: Эргономичный комбинезон с кевларовыми вставками. Лёгкость, защита и полный контроль состояния бойца в режиме реального времени.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/jumpsuit.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/jumpsuit.rsi

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackTraumaTeam
  categories: [ HideSpawnMenu ]
  name: сумка TTI Rapid-Response
  description: Тактический рюкзак с модульной системой хранения и взрывозащитой. Оптимален для экстренной доставки медикаментов в зонах боевых действий.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/backpack.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/backpack.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,5
  - type: ExplosionResistance
    damageCoefficient: 0.1

- type: entity
  parent: ClothingHandsGlovesCombat
  id: ClothingHandsGlovesCombatTraumaTeam
  name: боевые перчатки TTI Surgeon
  description: Тактические перчатки с усиленными накладками и сенсорной совместимостью. Позволяют работать с медицинскими интерфейсами без снятия защиты.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/gloves.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/gloves.rsi

- type: entity
  parent: ClothingMaskGas
  id: ClothingMaskGasTraumaTeam
  name: респиратор TTI Sentinel
  description: Тактический противогаз с дополнительной противопулевой защитой и системой фильтрации NBC-угроз. Встроенная защита от ослепления.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/gasmask.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/gasmask.rsi
  - type: FlashImmunity
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.9
        Heat: 0.95

- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterCoatTraumaTeam
  name: куртка сотрудника TTI
  description: Прочная куртка персонала TTI, на спине виднеется логотип организации.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/coat.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/coat.rsi

- type: entity
  parent: NFClothingBeltStorageBase
  id: ClothingBeltTraumaTeamWebbing
  name: РПС сотрудника TTI
  description: Идеально подходит для хранения всего, от боеприпасов до оружия и предметов первой необходимости для боя.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/belt.rsi
  - type: Clothing
    sprite: _Orehum/Factions/TraumaTeam/belt.rsi

- type: entity
  name: челюсти жизни TTI
  parent: JawsOfLife # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
  id: TraumaTeamJawsOfLife
  description: Удобно для входа в различные заблокированные места.
  components:
  - type: Sprite
    sprite: _Orehum/Factions/TraumaTeam/jawsoflife.rsi
    state: syn_jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: syn_inhand-left
      right:
      - state: syn_inhand-right
    size: Normal
  - type: Prying
    speedModifier: 3.0
  - type: MultipleTool
    entries:
      - behavior: Prying
        sprite:
          sprite: _Orehum/Factions/TraumaTeam/jawsoflife.rsi
          state: syn_jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _Orehum/Factions/TraumaTeam/jawsoflife.rsi
          state: syn_jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
